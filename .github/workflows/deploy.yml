name: Deploy Microservicio de Autenticación

on:
  push:
    branches:
      - main  
      
# Error - Update Secrets

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 🔄 Clonar el repositorio
        uses: actions/checkout@v3

      - name: 🐳 Iniciar sesión en Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: 🏗️ Construir la imagen Docker
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/auth-service:latest .

      - name: 🚀 Subir la imagen a Docker Hub
        run: docker push ${{ secrets.DOCKER_USERNAME }}/auth-service:latest

      - name: 🔑 Configurar SSH y desplegar en EC2
        run: |
          echo "${{ secrets.PRIVATE_KEY }}" > private_key.pem
          chmod 600 private_key.pem
          ssh -o StrictHostKeyChecking=no -i private_key.pem ${{ secrets.AWS_USER }}@${{ secrets.AWS_HOST }} << 'EOF'
            echo "🚀 Eliminando contenedor anterior..."
            docker stop auth-service || true
            docker rm auth-service || true
            docker pull ${{ secrets.DOCKER_USERNAME }}/auth-service:latest
            echo "🚀 Iniciando nuevo contenedor..."
            docker run -d -p 5000:5000 --name auth-service ${{ secrets.DOCKER_USERNAME }}/auth-service:latest
            echo "✅ Despliegue completado."
          EOF
